name: CI

on:
  push:
    # Fire on master AND on every feature branch (the PQ migration
    # branches under task/ and ###-* need CI feedback before PR review).
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod download

      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        continue-on-error: true
        run: go vet ./...

      - name: Test PQ foundations (verbose)
        # Run the four bn256-free PQ foundation packages with -v so
        # KAT pass/skip status is visible in CI logs. These packages
        # are also covered by the broader unit-test step below; this
        # step exists for signal visibility on PQ-migration PRs.
        run: |
          go test -v -race -count=1 \
            ./pqkem ./pqsig ./hybrid ./keywheel

      - name: Test (unit)
        run: |
          pkgs=$(go list ./... | grep -v '^github.com/oluies/neverlur$')
          go test -race -count=1 $pkgs

      - name: Test (integration)
        continue-on-error: true
        run: go test -race -count=1 -timeout 5m github.com/oluies/neverlur

      - name: Benchmark smoke (PQ foundations)
        # Run the foundational-package benchmarks once with a short
        # benchtime to confirm they execute without panicking. Does
        # NOT gate on numbers - the SC-007 1.25x baseline gate kicks
        # in once benchmarks/baseline-pre-pq.txt is populated with
        # real pre-migration numbers (see file header).
        continue-on-error: true
        run: |
          go test -run=^$ -bench=. -benchtime=200ms \
            ./pqkem ./pqsig ./hybrid

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
