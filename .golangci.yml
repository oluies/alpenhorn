# golangci-lint configuration.
#
# Scoping rationale:
#
#   The bulk of the inherited Alpenhorn codebase (everything not in
#   pqkem/, pqsig/, or hybrid/) predates routine lint gating and has
#   ~100 findings (deferred Close on TCP/WebSocket conns, fmt.Fprintf
#   into strings.Builder, ioutil deprecation, t.Fatal from goroutines,
#   etc.). Fixing all of them is a separate cleanup project, not
#   appropriate scope for the PQ migration PR.
#
#   This config restricts the standard linter set (errcheck, govet,
#   staticcheck, ineffassign, unused) to the PQ-migration packages
#   (pqkem/, pqsig/, hybrid/) where the discipline is load-bearing for
#   crypto correctness. The inherited code gets a free pass for now.
#
#   When the inherited code is cleaned up in a follow-up PR, the
#   path-except below can be widened or removed.
#
#   The govet "inline" check is disabled wholesale: it fires ~55 times
#   on inherited ioutil call sites that target go1.25 while ioutil
#   declares against go1.26.2. Build-environment noise.

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    govet:
      disable:
        - inline
  exclusions:
    rules:
      # Inherited Alpenhorn code: skip all standard linters. PR scope is
      # the PQ migration; inherited-code-quality cleanup is a separate PR.
      - path-except: '^(pqkem|pqsig|hybrid)/'
        linters:
          - errcheck
          - staticcheck
          - ineffassign
          - govet
          - unused
          - typecheck
